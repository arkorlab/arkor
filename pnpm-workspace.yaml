packages:
  - "packages/*"
  - "e2e/*"
  - "examples/*"
# Embed each published package's README.md into the `readme` field of
# the manifest it ships: the registry packument that npmjs.com reads to
# render the package page. The on-disk source `package.json` is not
# mutated. pnpm 11's native `pnpm publish` (it no longer shells out to
# the npm CLI) does NOT embed the README by default, which leaves the
# npmjs.com page blank. The release workflow publishes via `pnpm publish`
# (see `.github/workflows/build.yaml`), so this setting is what restores
# the rendered README on the registry. It applies to `pnpm pack` too, so
# the attested release tarballs and the e2e scaffold tarballs carry the
# same embedded README as the published packument.
embedReadme: true
# Single source of truth for direct third-party dependency versions
# declared in workspace `package.json` files. Each such `package.json`
# references entries here as `"<name>": "catalog:"` so a bump is one
# line here instead of N parallel `package.json` edits prone to drift.
# Scope (intentional): only direct deps that stay inside the
# workspace; transitive deps fall back to the lockfile and the
# supply-chain guards above. Workspace-internal links (`workspace:*`)
# stay inline.
#
# Excluded: the published packages' runtime `dependencies`
# (`packages/arkor` and `packages/create-arkor`). Those keep literal
# semver. This carve-out predates the switch to `pnpm publish`: under
# the old `npm publish` release path the `catalog:` protocol was sent
# to consumers verbatim (npm does not rewrite it) and surfaced as
# `EUNSUPPORTEDPROTOCOL`. `pnpm publish` (now used by
# `.github/workflows/build.yaml`) resolves `catalog:`/`workspace:` to
# concrete versions in the published manifest, so that hazard is gone.
# We still keep these two runtime-dep sets literal on purpose, so the
# published manifest mirrors source exactly with no publish-time
# catalog-expansion step to reason about. Their `devDependencies` are
# catalog-bound as normal: the field still ships in the published
# `package.json`, but consumer-side `npm install <pkg>` never installs
# a dependency's devDependencies, so `catalog:` there is never resolved
# at install time.
catalog:
  "@eslint/js": "^10.0.1"
  "@fontsource-variable/geist": "^5.3.0"
  "@fontsource-variable/geist-mono": "^5.3.0"
  "@playwright/test": "^1.63.0"
  "@stylistic/eslint-plugin": "^5.10.0"
  "@tailwindcss/vite": "^4.3.3"
  "@testing-library/jest-dom": "7.0.1"
  "@testing-library/react": "16.3.3"
  "@testing-library/user-event": "14.6.7"
  "@types/eslint-plugin-jsx-a11y": "^6.10.1"
  "@types/eslint-plugin-promise": "^7.3.0"
  "@types/node": "^24"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "@vitejs/plugin-react": "^6.1.1"
  "@vitest/coverage-v8": "^5.0.0"
  "@vitest/eslint-plugin": "^1.6.27"
  c8: "^12.0.0"
  eslint: "^10.4.0"
  eslint-import-resolver-typescript: "^4.4.5"
  eslint-plugin-import-x: "^4.17.1"
  eslint-plugin-jsx-a11y: "^6.10.2"
  eslint-plugin-n: "^18.3.0"
  eslint-plugin-promise: "^7.3.0"
  eslint-plugin-react-hooks: "^7.1.1"
  eslint-plugin-regexp: "^3.3.0"
  # Held at 64 on purpose. unicorn 74 is ten majors of new recommended
  # rules, and on this codebase they fire 648 times across 100 files:
  # `no-global-object-property-assignment` on the tests' `globalThis`
  # stubs, `consistent-boolean-name` on every boolean that is not
  # `is`/`has`/`can`-prefixed, `no-top-level-assignment-in-function` on
  # the vitest `beforeEach` fixture pattern, and so on. Deciding which of
  # those the repo adopts is a lint-policy change, not a dependency bump,
  # and this file's own guidance is to take rules one at a time rather
  # than by category. Tracked separately (Dependabot PR #274).
  eslint-plugin-unicorn: "^64.0.0"
  eventsource-parser: "^4.1.0"
  globals: "^17.12.0"
  # Held at 29 on purpose. jsdom 30's engines are
  # `^22.22.2 || ^24.15.0 || >=26.0.0`, which excludes this repo's
  # supported floor (Node 22.22.0) and most of the Node 24 entries the
  # CI matrix deliberately covers. Raising it means raising
  # `engines.node` on the published packages and trimming the matrix,
  # so it is deliberately out of scope here (Dependabot PR #264).
  jsdom: 29.1.1
  oxfmt: 0.67.0
  oxlint: 1.82.0
  react: "^19.3.0"
  react-dom: "^19.3.0"
  tailwindcss: "^4.3.3"
  tsdown: "^0.23.0"
  turbo: "^2.10.12"
  # Held at 5 on purpose. TypeScript 7 is outside the peer range of
  # `tsdown` / `rolldown-plugin-dts` (`^5.0.0 || ^6.0.0`) and of
  # `typescript-eslint`, and the declaration build stops emitting
  # `dist/bin.mjs` under it (Dependabot PR #272).
  typescript: "^5"
  typescript-eslint: "^8.70.0"
  vite: "^8.2.2"
  vitest: "^5.0.0"
minimumReleaseAge: 1440
# Narrow exemption from the 24h release-age gate. Scope is intentionally
# this single package, and the entry should NOT grow without thinking
# through the trade-off below. The gate still applies to every other
# third-party dep as a normal supply-chain guard.
#
# Why exempt `@arkor/cloud-api-client`:
#   - It's our own package, published from this org's GitHub workflow
#     via npm Trusted Publishing (OIDC). There's no long-lived NPM_TOKEN
#     in CI / contributor secrets, so a malicious publish would require
#     compromising the workflow itself, not a leaked credential.
#   - The arkor SDK and the control-plane shape evolve together and we
#     iterate the client multiple times per day during alpha. Sitting
#     out 24h per publish would block this submodule's CI from picking
#     up the matching server contract.
#   - The package is private-org-scoped (`@arkor/`), so a typo-squat
#     under the same name would fail npm's scope ownership check.
#
# Trade-off: a successful workflow compromise (or an internal mistake
# that publishes to alpha) is consumable here within the same hour
# instead of after 24h of cool-down. Mitigations: GitHub branch
# protection on the publishing workflow + the trustPolicy below would
# still block a downgrade attack.
minimumReleaseAgeExclude:
  - "@arkor/cloud-api-client"
trustPolicy: no-downgrade
trustPolicyExclude:
  # Pulled in by @vitejs/plugin-react -> @babel/core for Studio UI builds.
  - 'semver@6.3.1'
# Block transitive deps from resolving via exotic sources (git+ssh://...,
# direct tarball URLs, etc.). Direct deps may still use exotic sources;
# only transitives are restricted, so the registry/lockfile/release-age
# guards above remain the trust boundary for everything we pull in
# indirectly. Kept explicit as policy, not as a temporary pin: pnpm 10.x
# is opt-in and pnpm 11 makes it the default, but we want the value
# co-located with the other supply-chain guards so reviewers see the
# stance in one place, and so the setting stays pinned if a future pnpm
# release walks the default back.
blockExoticSubdeps: true
# Review decisions for dependencies that ship install scripts: `true`
# lets the script run, `false` blocks it. Anything that ships one and is
# listed neither way counts as unreviewed, and pnpm fails the install
# with `ERR_PNPM_IGNORED_BUILDS` (`strictDepBuilds` defaults to true)
# rather than skipping it quietly, so a new one has to be decided here
# on purpose. The three below are approved because the SDK build path
# needs their native binaries.
allowBuilds:
  rolldown: true
  unrs-resolver: true
  esbuild: true
